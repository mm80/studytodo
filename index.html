<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>할일 & 공부 기록</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' }
  </script>
  <style>
    body { margin: 0; min-height: 100vh; -webkit-font-smoothing: antialiased; }
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    input[type="number"] { -moz-appearance: textfield; }
    @media (hover: none) { .group .del-btn { opacity: 1 !important; } }
    .file-preview-modal { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; }
    .file-preview-modal .backdrop { position: absolute; inset: 0; background: rgba(0,0,0,0.7); }
    .file-preview-modal .content { position: relative; max-width: 90vw; max-height: 90vh; }
    .drag-over { border: 2px dashed #3b82f6 !important; background: rgba(59,130,246,0.05) !important; }
    .dragging-item { opacity: 0.5; }
    .drag-handle { cursor: grab; }
    .drag-handle:active { cursor: grabbing; }
  </style>
</head>
<body class="bg-white dark:bg-gray-900 transition-colors">
  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Firebase SDK (CDN) -->
  <script type="module" id="firebase-init">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged }
      from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
    import { getFirestore, collection, doc, setDoc, deleteDoc,
             onSnapshot, query, orderBy, writeBatch, serverTimestamp }
      from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAY1dTjNP7BS56CXNKk_qulGc3K5STuxZ8",
      authDomain: "study-622f8.firebaseapp.com",
      projectId: "study-622f8",
      storageBucket: "study-622f8.firebasestorage.app",
      messagingSenderId: "770328287645",
      appId: "1:770328287645:web:64685dad9a7f145fe7b774",
      measurementId: "G-955LMTEQXQ"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    // React 앱에서 접근할 수 있도록 전역으로 노출
    window.__firebase = { auth, db, provider, signInWithPopup, signOut,
      onAuthStateChanged, collection, doc, setDoc, deleteDoc,
      onSnapshot, query, orderBy, writeBatch, serverTimestamp };
  </script>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef, useCallback } = React;

    // Firebase 모듈이 로드될 때까지 대기하는 훅
    function useFirebase() {
      const [fb, setFb] = useState(null);
      useEffect(() => {
        const check = () => {
          if (window.__firebase) { setFb(window.__firebase); }
          else { setTimeout(check, 50); }
        };
        check();
      }, []);
      return fb;
    }

    // === Auth 훅 ===
    function useAuth(fb) {
      const [user, setUser] = useState(undefined); // undefined = 로딩 중
      useEffect(() => {
        if (!fb) return;
        const unsub = fb.onAuthStateChanged(fb.auth, (u) => setUser(u || null));
        return unsub;
      }, [fb]);
      return user;
    }

    // === Dark Mode ===
    function useDarkMode() {
      const [isDark, setIsDark] = useState(() => {
        const saved = localStorage.getItem('darkMode');
        if (saved !== null) return JSON.parse(saved);
        return window.matchMedia('(prefers-color-scheme: dark)').matches;
      });
      useEffect(() => {
        document.documentElement.classList.toggle('dark', isDark);
        localStorage.setItem('darkMode', JSON.stringify(isDark));
      }, [isDark]);
      return { isDark, toggle: () => setIsDark(p => !p) };
    }

    // === File helpers ===
    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function getFileIcon(file) {
      if (file.type && file.type.startsWith('image/')) return '🖼️';
      if (file.type && file.type.startsWith('audio/')) return '🎵';
      if (file.type === 'application/pdf') return '📄';
      return '📎';
    }

    // === FilePreviewModal ===
    function FilePreviewModal({ file, onClose }) {
      if (!file) return null;
      const isImage = file.type && file.type.startsWith('image/');
      const isAudio = file.type && file.type.startsWith('audio/');
      return (
        <div className="file-preview-modal">
          <div className="backdrop" onClick={onClose}></div>
          <div className="content bg-white dark:bg-gray-800 rounded-xl p-4 shadow-2xl overflow-auto max-h-[85vh]">
            <div className="flex justify-between items-center mb-3">
              <span className="text-sm font-medium text-gray-700 dark:text-gray-300 truncate max-w-[200px]">{file.name}</span>
              <div className="flex gap-2">
                <a href={file.data} download={file.name} className="px-3 py-1 text-xs bg-blue-600 text-white rounded-md hover:bg-blue-700">다운로드</a>
                <button onClick={onClose} className="px-3 py-1 text-xs bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-300 rounded-md hover:bg-gray-300 dark:hover:bg-gray-600">닫기</button>
              </div>
            </div>
            {isImage ? (
              <img src={file.data} alt={file.name} className="max-w-full max-h-[70vh] rounded-lg mx-auto" />
            ) : isAudio ? (
              <audio controls src={file.data} className="w-full mt-2">브라우저가 오디오를 지원하지 않습니다.</audio>
            ) : (
              <iframe src={file.data} className="w-full h-[70vh] rounded-lg border border-gray-200 dark:border-gray-700" title={file.name}></iframe>
            )}
          </div>
        </div>
      );
    }

    // === Header ===
    function Header({ isDark, onToggleDark, user, onLogin, onLogout }) {
      return (
        <header className="flex items-center justify-between px-4 py-4 sm:px-6 border-b border-gray-200 dark:border-gray-700">
          <h1 className="text-lg sm:text-xl font-bold tracking-tight text-gray-900 dark:text-gray-100">📋 할일 & 공부 기록</h1>
          <div className="flex items-center gap-2">
            {/* 로그인/로그아웃 버튼 */}
            {user ? (
              <div className="flex items-center gap-2">
                <img src={user.photoURL} alt={user.displayName} className="w-7 h-7 rounded-full" title={user.displayName} />
                <button onClick={onLogout}
                  className="px-2 py-1 text-xs rounded-lg bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-600 transition-colors">
                  로그아웃
                </button>
              </div>
            ) : user === null ? (
              <button onClick={onLogin}
                className="flex items-center gap-1.5 px-3 py-1.5 text-xs rounded-lg bg-blue-600 hover:bg-blue-700 text-white font-medium transition-colors">
                <svg className="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#fff"/>
                  <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#fff"/>
                  <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#fff"/>
                  <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#fff"/>
                </svg>
                Google 로그인
              </button>
            ) : null /* 로딩 중 */}
            {/* 다크 모드 토글 */}
            <button onClick={onToggleDark} className="p-2 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors text-gray-700 dark:text-gray-300" aria-label="다크 모드 토글">
              {isDark
                ? <svg xmlns="http://www.w3.org/2000/svg" className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" /></svg>
                : <svg xmlns="http://www.w3.org/2000/svg" className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" /></svg>
              }
            </button>
          </div>
        </header>
      );
    }

    // === TabNav ===
    function TabNav({ activeTab, onChangeTab }) {
      const tabs = [{ id: 'todos', label: '할일' }, { id: 'study', label: '공부 기록' }];
      return (
        <nav className="flex border-b border-gray-200 dark:border-gray-700">
          {tabs.map(tab => (
            <button key={tab.id} onClick={() => onChangeTab(tab.id)}
              className={`flex-1 py-3 text-sm font-medium transition-colors relative ${activeTab === tab.id ? 'text-gray-900 dark:text-blue-400' : 'text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-300'}`}>
              {tab.label}
              {activeTab === tab.id && <span className="absolute bottom-0 left-0 right-0 h-0.5 bg-gray-900 dark:bg-blue-400" />}
            </button>
          ))}
        </nav>
      );
    }

    // === 로그인 안내 화면 ===
    function LoginPrompt({ onLogin }) {
      return (
        <div className="flex flex-col items-center justify-center py-20 gap-4">
          <p className="text-gray-500 dark:text-gray-400 text-sm">Google 계정으로 로그인하면</p>
          <p className="text-gray-500 dark:text-gray-400 text-sm -mt-2">모든 기기에서 데이터가 동기화돼요</p>
          <button onClick={onLogin}
            className="flex items-center gap-2 px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-sm font-medium transition-colors mt-2">
            <svg className="w-4 h-4" viewBox="0 0 24 24" fill="currentColor">
              <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
              <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
              <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
              <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
            </svg>
            Google로 시작하기
          </button>
        </div>
      );
    }

    // === TodoItem ===
    function TodoItem({ todo, onToggle, onDelete, onPreviewFile, onDeleteFile, onEditText, onDeleteLink, dragEnabled, onDragStart, onDragOver, onDragLeave, onDragEnd, onDrop, selectMode, selectOrder, onSelect }) {
      const [isEditing, setIsEditing] = useState(false);
      const [editText, setEditText] = useState(todo.text);
      const completedDate = todo.completedAt ? new Date(todo.completedAt).toLocaleDateString('ko-KR', { month: 'short', day: 'numeric' }) : null;
      const isSelected = selectOrder > 0;

      const saveEdit = () => {
        const trimmed = editText.trim();
        if (trimmed) { onEditText(todo.id, trimmed); }
        setIsEditing(false);
      };
      const handleKeyDown = (e) => {
        if (e.key === 'Enter') saveEdit();
        if (e.key === 'Escape') { setEditText(todo.text); setIsEditing(false); }
      };

      return (
        <li className={`p-3 rounded-lg border group transition-colors ${isSelected ? 'bg-amber-50 dark:bg-amber-900/20 border-amber-300 dark:border-amber-600' : 'bg-white dark:bg-gray-800 border-gray-100 dark:border-gray-700'} ${selectMode ? 'cursor-pointer' : ''}`}
          draggable={dragEnabled && !selectMode}
          onDragStart={(e) => !selectMode && onDragStart && onDragStart(e, todo.id)}
          onDragOver={(e) => !selectMode && onDragOver && onDragOver(e, todo.id)}
          onDragLeave={!selectMode ? onDragLeave : undefined}
          onDragEnd={!selectMode ? onDragEnd : undefined}
          onDrop={(e) => !selectMode && onDrop && onDrop(e, todo.id)}
          onClick={() => selectMode && onSelect && onSelect(todo.id)}>
          <div className="flex items-center gap-2">
            {dragEnabled && !selectMode && (
              <span className="drag-handle flex-shrink-0 text-gray-300 dark:text-gray-600 hover:text-gray-500 dark:hover:text-gray-400" title="드래그하여 순서 변경">
                <svg className="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><circle cx="9" cy="6" r="1.5"/><circle cx="15" cy="6" r="1.5"/><circle cx="9" cy="12" r="1.5"/><circle cx="15" cy="12" r="1.5"/><circle cx="9" cy="18" r="1.5"/><circle cx="15" cy="18" r="1.5"/></svg>
              </span>
            )}
            {selectMode && (
              <span className={`flex-shrink-0 w-5 h-5 rounded-full border-2 flex items-center justify-center text-[10px] font-bold transition-colors ${isSelected ? 'bg-amber-400 border-amber-400 text-white' : 'border-gray-300 dark:border-gray-500'}`}>
                {isSelected ? selectOrder : ''}
              </span>
            )}
            {!selectMode && <button onClick={() => onToggle(todo.id)}
              className={`flex-shrink-0 w-5 h-5 rounded-full border-2 flex items-center justify-center transition-colors ${todo.completed ? 'bg-green-500 border-green-500 text-white' : 'border-gray-300 dark:border-gray-500 hover:border-blue-400'}`}
              aria-label={todo.completed ? '완료 취소' : '완료 처리'}>
              {todo.completed && <svg className="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={3} d="M5 13l4 4L19 7" /></svg>}
            </button>}
            {isEditing ? (
              <input type="text" value={editText} onChange={e => setEditText(e.target.value)} onBlur={saveEdit} onKeyDown={handleKeyDown} autoFocus
                className="flex-1 px-2 py-1 text-sm rounded border border-blue-400 dark:border-blue-500 bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100 focus:outline-none focus:ring-1 focus:ring-blue-500" />
            ) : (
              <span onDoubleClick={() => { setEditText(todo.text); setIsEditing(true); }}
                className={`flex-1 text-sm cursor-pointer ${todo.completed ? 'line-through text-gray-400 dark:text-gray-500' : 'text-gray-900 dark:text-gray-100'}`} title="더블클릭으로 수정">{todo.text}</span>
            )}
            {completedDate && <span className="text-xs text-gray-400 dark:text-gray-500">{completedDate}</span>}
            {!selectMode && <button onClick={() => { setEditText(todo.text); setIsEditing(true); }}
              className="del-btn flex-shrink-0 p-1 rounded text-gray-300 dark:text-gray-600 hover:text-blue-500 dark:hover:text-blue-400 opacity-0 group-hover:opacity-100 transition-opacity"
              aria-label="수정">
              <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" /></svg>
            </button>}
            {!selectMode && <button onClick={() => onDelete(todo.id)}
              className="del-btn flex-shrink-0 p-1 rounded text-gray-300 dark:text-gray-600 hover:text-red-500 dark:hover:text-red-400 opacity-0 group-hover:opacity-100 transition-opacity"
              aria-label="삭제">
              <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
            </button>}
          </div>
          {todo.files && todo.files.length > 0 && (
            <div className="mt-2 ml-8 flex flex-wrap gap-2">
              {todo.files.map((file, idx) => (
                <div key={idx} className="flex items-center gap-1.5 px-2 py-1 bg-gray-100 dark:bg-gray-700 rounded-md text-xs">
                  <span>{getFileIcon(file)}</span>
                  <button onClick={() => onPreviewFile(file)} className="text-blue-600 dark:text-blue-400 hover:underline truncate max-w-[120px]">{file.name}</button>
                  <button onClick={() => onDeleteFile(todo.id, idx)} className="text-gray-400 hover:text-red-500 ml-1" aria-label="첨부 삭제">×</button>
                </div>
              ))}
            </div>
          )}
          {todo.links && todo.links.length > 0 && (
            <div className="mt-2 ml-8 flex flex-wrap gap-2">
              {todo.links.map((link, idx) => (
                <div key={idx} className="flex items-center gap-1.5 px-2 py-1 bg-gray-100 dark:bg-gray-700 rounded-md text-xs">
                  <span>🔗</span>
                  <a href={link} target="_blank" rel="noopener noreferrer" className="text-blue-600 dark:text-blue-400 hover:underline truncate max-w-[140px]" title={link}>{link.replace(/^https?:\/\//, '').split('/')[0]}</a>
                  <button onClick={() => onDeleteLink(todo.id, idx)} className="text-gray-400 hover:text-red-500 ml-1" aria-label="링크 삭제">×</button>
                </div>
              ))}
            </div>
          )}
        </li>
      );
    }

    // === TodoTab ===
    function TodoTab({ fb, user }) {
      const [todos, setTodos] = useState([]);
      const [input, setInput] = useState('');
      const [previewFile, setPreviewFile] = useState(null);
      const fileInputRef = useRef(null);
      const [pendingFiles, setPendingFiles] = useState([]);
      const [pendingLinks, setPendingLinks] = useState([]);
      const [linkInput, setLinkInput] = useState('');
      const [showLinkInput, setShowLinkInput] = useState(false);
      const [isDragging, setIsDragging] = useState(false);
      const [dragLocked, setDragLocked] = useState(true);
      const dragCounter = useRef(0);
      const dragItemId = useRef(null);
      const [completedOpen, setCompletedOpen] = useState(true);
      const [selectMode, setSelectMode] = useState(false);
      const [selectedIds, setSelectedIds] = useState([]);
      const [menuOpen, setMenuOpen] = useState(false);
      const menuRef = useRef(null);

      // Firestore 실시간 동기화
      useEffect(() => {
        if (!fb || !user) return;
        const { db, collection, query, orderBy, onSnapshot } = fb;
        const q = query(collection(db, 'users', user.uid, 'todos'), orderBy('order', 'asc'));
        const unsub = onSnapshot(q, (snap) => {
          setTodos(snap.docs.map(d => ({ ...d.data(), id: d.id })));
        });
        return unsub;
      }, [fb, user]);

      useEffect(() => {
        const handler = (e) => { if (menuRef.current && !menuRef.current.contains(e.target)) setMenuOpen(false); };
        document.addEventListener('mousedown', handler);
        return () => document.removeEventListener('mousedown', handler);
      }, []);

      const active = todos.filter(t => !t.completed);
      const completed = todos.filter(t => t.completed);

      const processFiles = async (files) => {
        const processed = [];
        for (const file of files) {
          if (file.size > 10 * 1024 * 1024) { alert(`${file.name}: 10MB 이하 파일만 첨부 가능합니다.`); continue; }
          const allowed = file.type.startsWith('image/') || file.type === 'application/pdf' || file.type.startsWith('audio/');
          if (!allowed) { alert(`${file.name}: 이미지, PDF, 음악 파일만 첨부 가능합니다.`); continue; }
          const data = await fileToBase64(file);
          processed.push({ name: file.name, type: file.type, data });
        }
        return processed;
      };

      // Firestore에 todo 저장 헬퍼
      const saveTodo = async (todo) => {
        const { db, doc, setDoc } = fb;
        await setDoc(doc(db, 'users', user.uid, 'todos', String(todo.id)), todo);
      };
      const removeTodo = async (id) => {
        const { db, doc, deleteDoc } = fb;
        await deleteDoc(doc(db, 'users', user.uid, 'todos', String(id)));
      };

      // 파일 드래그 앤 드롭
      const handleDragEnter = (e) => {
        e.preventDefault(); e.stopPropagation();
        dragCounter.current++;
        if (e.dataTransfer.types.includes('Files')) setIsDragging(true);
      };
      const handleDragLeave = (e) => {
        e.preventDefault(); e.stopPropagation();
        dragCounter.current--;
        if (dragCounter.current === 0) setIsDragging(false);
      };
      const handleDragOver = (e) => { e.preventDefault(); e.stopPropagation(); };
      const handleDrop = async (e) => {
        e.preventDefault(); e.stopPropagation();
        setIsDragging(false); dragCounter.current = 0;
        const files = Array.from(e.dataTransfer.files);
        if (files.length === 0) return;
        const processed = await processFiles(files);
        if (processed.length === 0) return;
        const newTodo = {
          id: Date.now(), text: input.trim() || processed.map(f => f.name).join(', '),
          completed: false, completedAt: null, files: processed, links: [], order: Date.now()
        };
        await saveTodo(newTodo);
        setInput('');
      };

      const handleFileSelect = async (e) => {
        const files = Array.from(e.target.files);
        const processed = await processFiles(files);
        setPendingFiles(prev => [...prev, ...processed]);
        e.target.value = '';
      };
      const removePendingFile = (idx) => setPendingFiles(prev => prev.filter((_, i) => i !== idx));

      const addLink = () => {
        const url = linkInput.trim();
        if (!url) return;
        const finalUrl = url.match(/^https?:\/\//) ? url : 'https://' + url;
        setPendingLinks(prev => [...prev, finalUrl]);
        setLinkInput('');
      };
      const handleLinkKeyDown = (e) => { if (e.key === 'Enter') { e.preventDefault(); addLink(); } };
      const removePendingLink = (idx) => setPendingLinks(prev => prev.filter((_, i) => i !== idx));

      const add = async (e) => {
        e.preventDefault();
        const text = input.trim();
        if (!text && pendingFiles.length === 0 && pendingLinks.length === 0) return;
        const urlRegex = /(https?:\/\/[^\s]+)/g;
        const urls = text.match(urlRegex) || [];
        const cleanText = text.replace(urlRegex, '').trim();
        const autoLinks = urls.map(u => u.match(/^https?:\/\//) ? u : 'https://' + u);
        const allLinks = [...pendingLinks, ...autoLinks];
        const newTodo = {
          id: Date.now(),
          text: cleanText || pendingFiles.map(f => f.name).join(', ') || allLinks.map(l => l.replace(/^https?:\/\//, '').split('/')[0]).join(', ') || '링크',
          completed: false, completedAt: null,
          files: pendingFiles, links: allLinks,
          order: Date.now()
        };
        await saveTodo(newTodo);
        setInput(''); setPendingFiles([]); setPendingLinks([]); setShowLinkInput(false);
      };

      const toggle = async (id) => {
        const todo = todos.find(t => t.id === id);
        if (!todo) return;
        const updated = { ...todo, completed: !todo.completed, completedAt: !todo.completed ? new Date().toISOString() : null };
        await saveTodo(updated);
      };
      const del = async (id) => { await removeTodo(id); };
      const editText = async (id, newText) => {
        const todo = todos.find(t => t.id === id);
        if (!todo) return;
        await saveTodo({ ...todo, text: newText });
      };
      const deleteFile = async (todoId, fileIdx) => {
        const todo = todos.find(t => t.id === todoId);
        if (!todo) return;
        await saveTodo({ ...todo, files: todo.files.filter((_, i) => i !== fileIdx) });
      };
      const deleteLink = async (todoId, linkIdx) => {
        const todo = todos.find(t => t.id === todoId);
        if (!todo) return;
        await saveTodo({ ...todo, links: (todo.links || []).filter((_, i) => i !== linkIdx) });
      };

      const toggleSelectMode = () => { setSelectMode(m => !m); setSelectedIds([]); };
      const handleSelect = (id) => {
        setSelectedIds(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]);
      };

      const exportToText = () => {
        if (selectedIds.length === 0) return;
        const lines = selectedIds.map(id => todos.find(t => t.id === id)?.text).filter(Boolean);
        const blob = new Blob([lines.join('\n')], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = `할일_${new Date().toISOString().split('T')[0]}.txt`;
        a.click(); URL.revokeObjectURL(url);
        setSelectMode(false); setSelectedIds([]);
      };

      const dragEnabled = !dragLocked && !selectMode;
      const handleItemDragStart = (e, id) => {
        if (dragLocked) { e.preventDefault(); return; }
        dragItemId.current = id;
        e.currentTarget.classList.add('dragging-item');
        e.dataTransfer.effectAllowed = 'move';
      };
      const handleItemDragOver = (e, id) => {
        if (dragLocked) return;
        e.preventDefault();
        e.currentTarget.classList.add('drag-over');
      };
      const handleItemDragLeave = (e) => { e.currentTarget.classList.remove('drag-over'); };
      const handleItemDrop = async (e, targetId) => {
        e.preventDefault(); e.stopPropagation();
        e.currentTarget.classList.remove('drag-over');
        if (dragLocked || !dragItemId.current || dragItemId.current === targetId) return;
        const items = [...todos];
        const fromIdx = items.findIndex(t => t.id === dragItemId.current);
        const toIdx = items.findIndex(t => t.id === targetId);
        if (fromIdx === -1 || toIdx === -1) return;
        const [moved] = items.splice(fromIdx, 1);
        items.splice(toIdx, 0, moved);
        // order 값 재계산 후 일괄 저장
        const { db, doc, writeBatch } = fb;
        const batch = writeBatch(db);
        items.forEach((item, idx) => {
          batch.set(doc(db, 'users', user.uid, 'todos', String(item.id)), { ...item, order: idx });
        });
        await batch.commit();
        dragItemId.current = null;
      };
      const handleItemDragEnd = (e) => {
        e.currentTarget.classList.remove('dragging-item');
        dragItemId.current = null;
      };

      return (
        <div className="space-y-4 relative"
          onDragEnter={handleDragEnter} onDragLeave={handleDragLeave} onDragOver={handleDragOver} onDrop={handleDrop}>

          {isDragging && (
            <div className="absolute inset-0 z-40 flex items-center justify-center rounded-xl border-2 border-dashed border-blue-400 dark:border-blue-500 bg-blue-50/90 dark:bg-blue-900/50 backdrop-blur-sm">
              <div className="text-center">
                <svg className="w-12 h-12 mx-auto text-blue-500 dark:text-blue-400 mb-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
                </svg>
                <p className="text-sm font-medium text-blue-700 dark:text-blue-300">여기에 파일을 놓으세요</p>
                <p className="text-xs text-blue-500 dark:text-blue-400 mt-1">이미지, PDF, 음악 파일 지원 (10MB 이하)</p>
              </div>
            </div>
          )}

          <form onSubmit={add} className="space-y-2">
            <div className="flex gap-2">
              <input type="text" value={input} onChange={e => setInput(e.target.value)} placeholder="할일을 입력하세요"
                className="flex-1 px-3 py-2 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100 placeholder-gray-400 dark:placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm" />
              <button type="submit" className="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-medium transition-colors">추가</button>
              <div className="relative" ref={menuRef}>
                <button type="button" onClick={() => setMenuOpen(o => !o)}
                  className={`px-3 py-2 rounded-lg text-sm transition-colors ${menuOpen ? 'bg-gray-200 dark:bg-gray-600 text-gray-800 dark:text-gray-100' : 'bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 text-gray-600 dark:text-gray-300'}`}
                  title="더보기">
                  <svg className="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                    <circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/>
                  </svg>
                </button>
                {menuOpen && (
                  <div className="absolute right-0 top-full mt-1 w-44 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl shadow-lg z-30 overflow-hidden">
                    <button type="button" onClick={() => { fileInputRef.current?.click(); setMenuOpen(false); }}
                      className="flex items-center gap-3 w-full px-4 py-2.5 text-sm text-gray-700 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors">
                      <svg className="w-4 h-4 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13" /></svg>
                      파일 첨부
                    </button>
                    <div className="h-px bg-gray-100 dark:bg-gray-700" />
                    <button type="button" onClick={() => { setDragLocked(l => !l); setMenuOpen(false); }}
                      className="flex items-center gap-3 w-full px-4 py-2.5 text-sm text-gray-700 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors">
                      {dragLocked
                        ? <svg className="w-4 h-4 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" /></svg>
                        : <svg className="w-4 h-4 text-blue-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8 11V7a4 4 0 118 0m-4 8v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2z" /></svg>
                      }
                      <span className={dragLocked ? '' : 'text-blue-600 dark:text-blue-400 font-medium'}>{dragLocked ? '순서 잠금' : '순서 변경 중'}</span>
                    </button>
                    <div className="h-px bg-gray-100 dark:bg-gray-700" />
                    <button type="button" onClick={() => { toggleSelectMode(); setMenuOpen(false); }}
                      className="flex items-center gap-3 w-full px-4 py-2.5 text-sm text-gray-700 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors">
                      <svg className="w-4 h-4 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>
                      내보내기
                    </button>
                  </div>
                )}
              </div>
            </div>
            <input ref={fileInputRef} type="file" accept="image/*,.pdf,audio/*" multiple onChange={handleFileSelect} className="hidden" />
            {pendingFiles.length > 0 && (
              <div className="flex flex-wrap gap-2 ml-1">
                {pendingFiles.map((f, i) => (
                  <span key={i} className="flex items-center gap-1 px-2 py-1 bg-blue-50 dark:bg-blue-900/30 border border-blue-200 dark:border-blue-700 rounded-md text-xs text-blue-700 dark:text-blue-300">
                    {getFileIcon(f)} {f.name.length > 15 ? f.name.slice(0,12)+'...' : f.name}
                    <button type="button" onClick={() => removePendingFile(i)} className="ml-1 text-blue-400 hover:text-red-500">×</button>
                  </span>
                ))}
              </div>
            )}
            {pendingLinks.length > 0 && (
              <div className="flex flex-wrap gap-2 ml-1">
                {pendingLinks.map((link, i) => (
                  <span key={i} className="flex items-center gap-1 px-2 py-1 bg-green-50 dark:bg-green-900/30 border border-green-200 dark:border-green-700 rounded-md text-xs text-green-700 dark:text-green-300">
                    🔗 {link.replace(/^https?:\/\//, '').split('/')[0]}
                    <button type="button" onClick={() => removePendingLink(i)} className="ml-1 text-green-400 hover:text-red-500">×</button>
                  </span>
                ))}
              </div>
            )}
          </form>

          {selectMode && (
            <div className="flex items-center justify-between">
              <span className="text-xs text-gray-500 dark:text-gray-400">{selectedIds.length}개 선택됨</span>
              <button onClick={exportToText} disabled={selectedIds.length === 0}
                className="flex items-center gap-1 px-2.5 py-1 rounded-md text-xs font-medium bg-amber-500 hover:bg-amber-600 disabled:opacity-40 disabled:cursor-not-allowed text-white transition-colors">
                <svg className="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>
                텍스트로 내보내기
              </button>
            </div>
          )}

          {active.length === 0 && completed.length === 0 && (
            <div className="text-center py-8">
              <p className="text-gray-400 dark:text-gray-500 text-sm">할일을 추가해보세요</p>
              <p className="text-gray-300 dark:text-gray-600 text-xs mt-1">파일을 이 영역에 드래그해도 됩니다</p>
            </div>
          )}
          {active.length > 0 && (
            <ul className="space-y-2">
              {active.map(t => <TodoItem key={t.id} todo={t} onToggle={toggle} onDelete={del} onEditText={editText}
                onPreviewFile={setPreviewFile} onDeleteFile={deleteFile} onDeleteLink={deleteLink}
                dragEnabled={dragEnabled} selectMode={selectMode}
                selectOrder={selectedIds.indexOf(t.id) + 1} onSelect={handleSelect}
                onDragStart={handleItemDragStart} onDragOver={handleItemDragOver} onDragLeave={handleItemDragLeave} onDragEnd={handleItemDragEnd} onDrop={handleItemDrop} />)}
            </ul>
          )}
          {completed.length > 0 && (
            <div className="mt-6">
              <button onClick={() => setCompletedOpen(o => !o)} className="flex items-center gap-2 w-full text-left mb-2 group/toggle">
                <svg className={`w-3.5 h-3.5 text-gray-400 dark:text-gray-500 transition-transform duration-200 ${completedOpen ? 'rotate-90' : ''}`}
                  fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 5l7 7-7 7" />
                </svg>
                <h3 className="text-xs font-semibold uppercase text-gray-400 dark:text-gray-500 tracking-wider group-hover/toggle:text-gray-600 dark:group-hover/toggle:text-gray-300 transition-colors">
                  완료됨 ({completed.length})
                </h3>
              </button>
              {completedOpen && (
                <ul className="space-y-2">{completed.map(t => <TodoItem key={t.id} todo={t} onToggle={toggle} onDelete={del} onEditText={editText}
                  onPreviewFile={setPreviewFile} onDeleteFile={deleteFile} onDeleteLink={deleteLink}
                  dragEnabled={dragEnabled} selectMode={selectMode}
                  selectOrder={selectedIds.indexOf(t.id) + 1} onSelect={handleSelect}
                  onDragStart={handleItemDragStart} onDragOver={handleItemDragOver} onDragLeave={handleItemDragLeave} onDragEnd={handleItemDragEnd} onDrop={handleItemDrop} />)}</ul>
              )}
            </div>
          )}
          {previewFile && <FilePreviewModal file={previewFile} onClose={() => setPreviewFile(null)} />}
        </div>
      );
    }

    // === StudyListView ===
    function StudyListView({ records, onDelete }) {
      const sorted = [...records].sort((a, b) => b.date.localeCompare(a.date) || b.createdAt.localeCompare(a.createdAt));
      const fmt = (h, m) => { const p = []; if (h > 0) p.push(`${h}시간`); if (m > 0) p.push(`${m}분`); return p.join(' '); };
      const fmtDate = (d) => new Date(d + 'T00:00:00').toLocaleDateString('ko-KR', { month: 'long', day: 'numeric', weekday: 'short' });

      if (sorted.length === 0) return <p className="text-center text-gray-400 dark:text-gray-500 py-8 text-sm">공부 기록을 추가해보세요</p>;
      return (
        <ul className="space-y-2">
          {sorted.map(r => (
            <li key={r.id} className="flex items-center justify-between p-3 rounded-lg bg-white dark:bg-gray-800 border border-gray-100 dark:border-gray-700 group">
              <div className="flex items-center gap-3">
                <span className="text-lg">📚</span>
                <div>
                  <p className="text-sm font-medium text-gray-900 dark:text-gray-100">{fmt(r.hours, r.minutes)}</p>
                  <p className="text-xs text-gray-400 dark:text-gray-500">{fmtDate(r.date)}</p>
                </div>
              </div>
              <button onClick={() => onDelete(r.id)} className="del-btn p-1 rounded text-gray-300 dark:text-gray-600 hover:text-red-500 dark:hover:text-red-400 opacity-0 group-hover:opacity-100 transition-opacity" aria-label="삭제">
                <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
              </button>
            </li>
          ))}
        </ul>
      );
    }

    // === StudyCalendarView ===
    function StudyCalendarView({ records }) {
      const [currentDate, setCurrentDate] = useState(() => new Date());
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();

      const dailyTotals = useMemo(() => {
        const map = {};
        records.forEach(r => { map[r.date] = (map[r.date] || 0) + r.totalMinutes; });
        return map;
      }, [records]);

      const calendarDays = useMemo(() => {
        const first = new Date(year, month, 1);
        const last = new Date(year, month + 1, 0);
        const days = [];
        for (let i = 0; i < first.getDay(); i++) days.push(null);
        for (let d = 1; d <= last.getDate(); d++) {
          const ds = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
          days.push({ day: d, date: ds, minutes: dailyTotals[ds] || 0 });
        }
        return days;
      }, [year, month, dailyTotals]);

      const weeklyTotals = useMemo(() => {
        const weeks = []; let wm = 0;
        calendarDays.forEach((day, i) => {
          if (i > 0 && i % 7 === 0) { weeks.push(wm); wm = 0; }
          if (day) wm += day.minutes;
        });
        weeks.push(wm);
        return weeks;
      }, [calendarDays]);

      const monthlyTotal = useMemo(() => calendarDays.reduce((s, d) => s + (d?.minutes || 0), 0), [calendarDays]);

      const fmtMin = (m) => { if (m === 0) return '-'; const h = Math.floor(m/60); const mn = m%60; if (h>0&&mn>0) return `${h}h ${mn}m`; if (h>0) return `${h}h`; return `${mn}m`; };
      const intensity = (m) => { if (!m) return ''; if (m<60) return 'bg-blue-100 dark:bg-blue-900/30'; if (m<120) return 'bg-blue-200 dark:bg-blue-800/40'; if (m<180) return 'bg-blue-300 dark:bg-blue-700/50'; return 'bg-blue-400 dark:bg-blue-600/60'; };

      return (
        <div className="space-y-4">
          <div className="flex items-center justify-between">
            <button onClick={() => setCurrentDate(new Date(year, month-1, 1))} className="p-1.5 rounded hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors text-gray-600 dark:text-gray-400" aria-label="이전 달">
              <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 19l-7-7 7-7" /></svg>
            </button>
            <h3 className="text-sm font-semibold text-gray-900 dark:text-gray-100">{year}년 {month+1}월</h3>
            <button onClick={() => setCurrentDate(new Date(year, month+1, 1))} className="p-1.5 rounded hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors text-gray-600 dark:text-gray-400" aria-label="다음 달">
              <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 5l7 7-7 7" /></svg>
            </button>
          </div>
          <div className="grid grid-cols-7 gap-1">
            {['일','월','화','수','목','금','토'].map(d => <div key={d} className="text-center text-xs font-medium text-gray-400 dark:text-gray-500 py-1">{d}</div>)}
            {calendarDays.map((day, i) => (
              <div key={i} className={`aspect-square flex flex-col items-center justify-center rounded-md text-xs ${day ? intensity(day.minutes) : ''} ${day ? 'border border-gray-100 dark:border-gray-700' : ''}`}>
                {day && <>
                  <span className="text-[10px] text-gray-600 dark:text-gray-400">{day.day}</span>
                  {day.minutes > 0 && <span className="text-[9px] font-medium text-blue-700 dark:text-blue-300 mt-0.5">{fmtMin(day.minutes)}</span>}
                </>}
              </div>
            ))}
          </div>
          <div className="space-y-2 pt-2 border-t border-gray-200 dark:border-gray-700">
            <div className="flex items-center justify-between">
              <span className="text-xs font-semibold text-gray-500 dark:text-gray-400">월 합산</span>
              <span className="text-sm font-bold text-blue-600 dark:text-blue-400">{fmtMin(monthlyTotal)}</span>
            </div>
            <div className="space-y-1">
              <span className="text-xs font-semibold text-gray-500 dark:text-gray-400">주별 합산</span>
              {weeklyTotals.map((w, i) => (
                <div key={i} className="flex items-center justify-between pl-2">
                  <span className="text-xs text-gray-400 dark:text-gray-500">{i+1}주차</span>
                  <span className="text-xs font-medium text-gray-700 dark:text-gray-300">{fmtMin(w)}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // === StudyTab ===
    function StudyTab({ fb, user }) {
      const [records, setRecords] = useState([]);
      const [view, setView] = useState('list');
      const [date, setDate] = useState(() => new Date().toISOString().split('T')[0]);
      const [hours, setHours] = useState('');
      const [minutes, setMinutes] = useState('');

      // Firestore 실시간 동기화
      useEffect(() => {
        if (!fb || !user) return;
        const { db, collection, query, orderBy, onSnapshot } = fb;
        const q = query(collection(db, 'users', user.uid, 'studyRecords'), orderBy('createdAt', 'desc'));
        const unsub = onSnapshot(q, (snap) => {
          setRecords(snap.docs.map(d => ({ ...d.data(), id: d.id })));
        });
        return unsub;
      }, [fb, user]);

      const saveRecord = async (record) => {
        const { db, doc, setDoc } = fb;
        await setDoc(doc(db, 'users', user.uid, 'studyRecords', String(record.id)), record);
      };
      const removeRecord = async (id) => {
        const { db, doc, deleteDoc } = fb;
        await deleteDoc(doc(db, 'users', user.uid, 'studyRecords', String(id)));
      };

      const add = async (e) => {
        e.preventDefault();
        const h = parseInt(hours) || 0;
        const m = parseInt(minutes) || 0;
        if (h === 0 && m === 0) return;
        const newRecord = { id: Date.now(), date, hours: h, minutes: m, totalMinutes: h*60+m, createdAt: new Date().toISOString() };
        await saveRecord(newRecord);
        setHours(''); setMinutes('');
      };
      const del = async (id) => { await removeRecord(id); };

      const inputCls = "px-3 py-2 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100 placeholder-gray-400 dark:placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm";

      return (
        <div className="space-y-4">
          <form onSubmit={add} className="space-y-3">
            <input type="date" value={date} onChange={e => setDate(e.target.value)} className={inputCls} />
            <div className="flex gap-2 items-center flex-wrap">
              <input type="number" min="0" max="23" value={hours} onChange={e => setHours(e.target.value)} placeholder="0" className={`${inputCls} w-16 text-center`} />
              <span className="text-sm text-gray-500 dark:text-gray-400">시간</span>
              <input type="number" min="0" max="59" value={minutes} onChange={e => setMinutes(e.target.value)} placeholder="0" className={`${inputCls} w-16 text-center`} />
              <span className="text-sm text-gray-500 dark:text-gray-400">분</span>
              <button type="submit" className="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-medium transition-colors">기록</button>
            </div>
          </form>

          <div className="flex gap-1 bg-gray-100 dark:bg-gray-800 rounded-lg p-1">
            {[{id:'list',label:'리스트'},{id:'calendar',label:'달력'}].map(v => (
              <button key={v.id} onClick={() => setView(v.id)}
                className={`flex-1 py-1.5 text-xs font-medium rounded-md transition-colors ${view === v.id ? 'bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100 shadow-sm' : 'text-gray-500 dark:text-gray-400'}`}>
                {v.label}
              </button>
            ))}
          </div>

          {view === 'list' && <StudyListView records={records} onDelete={del} />}
          {view === 'calendar' && <StudyCalendarView records={records} />}
        </div>
      );
    }

    // === App ===
    function App() {
      const { isDark, toggle } = useDarkMode();
      const [activeTab, setActiveTab] = useState('todos');
      const fb = useFirebase();
      const user = useAuth(fb);

      const handleLogin = async () => {
        if (!fb) return;
        try { await fb.signInWithPopup(fb.auth, fb.provider); }
        catch (e) { console.error('로그인 실패:', e); }
      };
      const handleLogout = async () => {
        if (!fb) return;
        await fb.signOut(fb.auth);
      };

      return (
        <div className="min-h-screen bg-[#f5f0e8] dark:bg-gray-900 text-gray-900 dark:text-gray-100 transition-colors">
          <div className="max-w-2xl mx-auto">
            <Header isDark={isDark} onToggleDark={toggle} user={user} onLogin={handleLogin} onLogout={handleLogout} />
            {user === undefined ? (
              // Firebase 초기화 로딩 중
              <div className="flex justify-center py-20">
                <svg className="animate-spin w-6 h-6 text-gray-400" fill="none" viewBox="0 0 24 24">
                  <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"/>
                  <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"/>
                </svg>
              </div>
            ) : user === null ? (
              // 로그인 안내
              <LoginPrompt onLogin={handleLogin} />
            ) : (
              // 로그인 완료 → 앱 본문
              <>
                <TabNav activeTab={activeTab} onChangeTab={setActiveTab} />
                <main className="p-4 sm:p6">
                  {activeTab === 'todos' && <TodoTab fb={fb} user={user} />}
                  {activeTab === 'study' && <StudyTab fb={fb} user={user} />}
                </main>
              </>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
